<!DOCTYPE html>
<html lang="zh-CN">

    <title>云江论坛</title>

    <style>
        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
            padding-top: 30px;
        }

        a { text-decoration: none; color: inherit; }

        .top-bar {
            background-color: #e0e0e0;
            color: #555;
            font-size: 13px;
            padding: 6px 40px;
            display: flex;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .navbar {
            background-color: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 30px;
            z-index: 99;
        }

        .navbar-logo {
            font-family: "SimHei", sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #1f3a5f;
        }

        .nav-links a {
            margin-left: 30px;
            font-family: "SimHei", sans-serif;
            font-size: 15px;
            color: #555;
        }

        .nav-back {
            margin-right: 20px;
            font-size: 14px;
            color: #1f3a5f;
            font-family: "SimHei", sans-serif;
            cursor: pointer;
        }

        .nav-back:hover {
            text-decoration: underline;
        }

        .nav-search input {
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 14px;
            width: 180px;
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: #1f3a5f;
        }

        .post-card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }

        .post-title {
            font-size: 22px;
            font-family: "SimHei", sans-serif;
            margin-bottom: 10px;
        }

        .post-meta {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }

        .post-content {
            font-size: 16px;
            line-height: 1.8;
        }

        .reply-list {
            margin-top: 20px;
        }

        .reply-item {
            display: flex;
            gap: 15px;
            padding: 20px 0;
            border-top: 1px solid #eee;
        }

        /* ✅ 修改：头像区域 */
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reply-main {
            flex: 1;
        }

        .reply-author {
            font-weight: bold;
            color: #1f3a5f;
            margin-bottom: 6px;
        }

        .reply-time {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
        }

        .reply-body {
            font-size: 15px;
            line-height: 1.7;
        }

        .underline-link {
            text-decoration: underline;
            color: #1f3a5f;
        }

        .pagination {
            text-align: center;
            margin: 20px 0 40px;
        }

        .pagination a {
            display: inline-block;
            padding: 8px 14px;
            margin: 0 4px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
        }

        .pagination a.active {
            background: #1f3a5f;
            color: #fff;
            border-color: #1f3a5f;
        }

        .footer {
            background-color: #1f3a5f;
            color: #cfd8dc;
            text-align: center;
            padding: 30px;
            font-size: 13px;
        }

        .page-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            font-family: "SimHei", sans-serif;
        }

    <script>
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            document.getElementById('current-time').innerText =
                `${year}年${month}月${day}日 ${weekdays[now.getDay()]}`;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
