<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云江论坛</title>

    <style>
        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
            padding-top: 30px;
        }

        a { text-decoration: none; color: inherit; }

        .top-bar {
            background-color: #e0e0e0;
            color: #555;
            font-size: 13px;
            padding: 6px 40px;
            display: flex;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .navbar {
            background-color: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 30px;
            z-index: 99;
        }

        .navbar-logo {
            font-family: "SimHei", sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #1f3a5f;
        }

        .nav-links a {
            margin-left: 30px;
            font-family: "SimHei", sans-serif;
            font-size: 15px;
            color: #555;
        }

        /* ✅ 返回按钮样式 */
        .nav-back {
            margin-right: 20px;
            font-size: 14px;
            color: #1f3a5f;
            font-family: "SimHei", sans-serif;
            cursor: pointer;
        }

        .nav-back:hover {
            text-decoration: underline;
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: #1f3a5f;
        }

        .post-card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }

        .post-title {
            font-size: 22px;
            font-family: "SimHei", sans-serif;
            margin-bottom: 10px;
            text-align: center;
        }

        .post-meta {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
            text-align: center;
        }

        .notice-image {
            text-align: center;
            margin: 20px 0;
        }

        .notice-image img {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .footer {
            background-color: #1f3a5f;
            color: #cfd8dc;
            text-align: center;
            padding: 30px;
            font-size: 13px;
        }

        .page-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            font-family: "SimHei", sans-serif;
        }
    </style>
</head>
<body>

    <!-- 顶部灰条 -->
    <div class="top-bar">
        <span id="current-time"></span>
        <span>技术支持：润泽集团</span>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-logo">云江论坛</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">版块</a>
            <a href="#">精选</a>
            <a href="#">排行榜</a>
        </div>

        <!-- ✅ 返回按钮（原搜索框位置） -->
        <a href="19LunTan.html" class="nav-back">← 返回</a>
    </nav>

    <!-- 主体 -->
    <div class="main-container">

        <div class="breadcrumb">
            <a href="#">云江论坛</a> › <a href="#">公告通知</a> › 云江计划前成员案件通报
        </div>

        <!-- 通报内容 -->
        <div class="post-card">
            <div class="notice-image">
                <img src="tongbao.png" alt="案件通报">
            </div>
        </div>

    </div>

    <!-- 底部 -->
    <footer class="footer">
        @润泽集团 本界面非真实官方网站，仅作解谜使用。
    </footer>

    <!-- 页码 -->
    <div class="page-indicator">25 / 31</div>

    <!-- 实时时间 -->
    <script>
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            document.getElementById('current-time').innerText =
                `${year}年${month}月${day}日 ${weekdays[now.getDay()]}`;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>
</html>
