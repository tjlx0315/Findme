<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云江论坛 · 录音档案</title>

    <style>
        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
            padding-top: 30px;
        }

        a { text-decoration: none; color: inherit; }

        .top-bar {
            background-color: #e0e0e0;
            color: #555;
            font-size: 13px;
            padding: 6px 40px;
            display: flex;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .navbar {
            background-color: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 30px;
            z-index: 99;
        }

        .navbar-logo {
            font-family: "SimHei", sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #1f3a5f;
        }

        .nav-links a {
            margin-left: 30px;
            font-family: "SimHei", sans-serif;
            font-size: 15px;
            color: #555;
        }

        .main-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: #1f3a5f;
        }

        .audio-card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 25px;
        }

        .audio-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .audio-meta {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }

        .play-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            background-color: #1f3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .transcript-box {
            background: #f0f2f5;
            border-left: 4px solid #1f3a5f;
            padding: 20px;
            min-height: 150px;
            font-size: 15px;
            line-height: 1.8;
            color: #222;
        }

        .transcript-line {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            margin-bottom: 10px;
        }

        /* ✅ 新增：档案备注样式 */
        .archive-note {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .archive-note strong {
            color: #1f3a5f;
        }

        .footer {
            background-color: #1f3a5f;
            color: #cfd8dc;
            text-align: center;
            padding: 30px;
            font-size: 13px;
        }

        .page-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            font-family: "SimHei", sans-serif;
        }
    </style>
</head>
<body>

    <!-- 顶部灰条 -->
    <div class="top-bar">
        <span id="current-time"></span>
        <span>技术支持：润泽集团</span>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-logo">云江论坛</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">版块</a>
            <a href="#">精选</a>
            <a href="#">排行榜</a>
        </div>
    </nav>

    <!-- 主体 -->
    <div class="main-container">

        <div class="breadcrumb">
            <a href="#">云江论坛</a> › <a href="#">档案室</a> › 录音档案
        </div>

        <div class="audio-card">
            <div class="audio-title">录音文件：生惠泽润</div>
            <div class="audio-meta">编号：26 / 31 | 日期：2022.12.08</div>

            <button class="play-button" id="playBtn">▶ 点击播放录音</button>

            <div class="transcript-box" id="transcriptBox">
                <!-- 录音字幕会在这里逐行出现 -->
            </div>

            <!-- ✅ 新增：隐藏线索 -->
            <div class="archive-note">
                <strong>陈薇曾经是南湾一中的一名普通数学老师，那时她还叫陈淼。但2020年9月1日，那件事改变了她的一生。</strong>
            </div>

        </div>

    </div>

    <!-- 底部 -->
    <footer class="footer">
        @润泽集团 本界面非真实官方网站，仅作解谜使用。
    </footer>

    <!-- 页码 -->
    <div class="page-indicator">26 / 31</div>

    <!-- 实时时间 -->
    <script>
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            document.getElementById('current-time').innerText =
                `${year}年${month}月${day}日 ${weekdays[now.getDay()]}`;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

    <!-- 录音播放与字幕逻辑 -->
    <script>
        const playBtn = document.getElementById('playBtn');
        const transcriptBox = document.getElementById('transcriptBox');

        const transcriptData = [
            { time: 0, text: "说话人a：你想的点子可真好，集团十几年没排出去的埋在地下的废水，这么处理一下就摇身一变成了可使用的生活用水。" },
            { time: 2000, text: "说话人b：哈哈，老辛你可别揶揄我，我可不敢喝。" },
            { time: 4000, text: "说话人a：得亏你和陈姐弄了那么个名头，把这帮学生都骗进来，早就看不惯她们那种啥都不懂的蠢样子了。" },
            { time: 6000, text: "说话人b：迟早得找个由头把我俩名字从一中官网上弄下去。" },
            { time: 8000, text: "（说话声渐弱，只剩下录音者急促的呼吸）" }
        ];

        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) return;
            isPlaying = true;

            playBtn.textContent = "▶ 播放中...";
            transcriptBox.innerHTML = '';

            transcriptData.forEach((line, index) => {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.className = 'transcript-line';
                    p.textContent = line.text;
                    transcriptBox.appendChild(p);

                    requestAnimationFrame(() => {
                        p.style.opacity = 1;
                    });

                    if (index === transcriptData.length - 1) {
                        setTimeout(() => {
                            playBtn.textContent = "▶ 点击播放录音";
                            isPlaying = false;
                        }, 4000);
                    }
                }, line.time);
            });
        });
    </script>

</body>
</html>
