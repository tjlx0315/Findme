<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坏结局</title>

    <style>
        body {
            background-color: #f5f7fa;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .end-card {
            background-color: #ffffff;
            border: 1px solid #dce3ec;
            border-radius: 6px;
            padding: 50px 60px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(38, 55, 106, 0.08);
            text-align: center;
        }

        .end-card h2 {
            font-family: "SimSun", serif;
            font-size: 26px;
            color: #26376a;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .end-card p {
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 16px;
            text-align: left;
        }

        .ending-image {
            margin-top: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .ending-image img {
            max-width: 100%;
            height: auto;
            border: 1px solid #e8e8e8;
        }

        /* --- 新增的按钮样式 --- */
        .restart-button {
            margin-top: 40px;
            padding: 14px 40px;
            font-size: 16px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #ffffff;
            background-color: #26376a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .restart-button:hover {
            background-color: #1f2d5a;
        }
    </style>
</head>
<body>

    <div class="end-card">
        <h2>坏结局</h2>

        <p>
            你毫不迟疑地迈上了旅途，一步，两步，你在空无一人的校车上找了个位置坐下。
        </p>
        <p>
            手机振动起来，一个陌生号码给你发来短信，“多亏了你的提前通知，现在我们来接你了。”
        </p>
        <p>
            屏幕黑了下去，映出你困惑的脸，此时你才注意到，自己上车许久，车门紧闭，司机却没有要操作的意思。
        </p>
        <p>
            两侧的窗玻璃幽幽地映出窗外的景色，深蓝色贴膜隔绝了绝大多数光线，车内气氛太过诡异，你猛地站起来试图逃离，但身后车门的开启打断了你的动作。
        </p>
        <p>
            你终于明白沈伏日记里写的“他们”是什么了，可一切为时已晚。
        </p>

        <div class="ending-image">
            <img src="1end.png" alt="结局插图">
        </div>

        <!-- 新增的按钮 -->
        <button class="restart-button" onclick="window.location.href='30XiaoChe.html'">
            我们重来一次
        </button>
    </div>

</body>
</html>
